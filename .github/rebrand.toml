# What `scripts/rebrand.py` renames: upstream's DesignCraft becomes Pliego, in file contents and in
# paths. The weekly upstream sync applies the same rules to upstream's tree before merging it, so
# a rule added here applies to everything upstream sends from then on.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first. Keep spans are found before any replacement, so a replacement never reaches inside
# one.

# Left as they are wherever they appear (in file contents and in paths).
keep = [
    # Links to upstream's issues, pull requests and commits: history, not branding.
    "(https?://)?github\\.com/storytold/[\\w.-]+/(issues|pull|commit|discussions)/[^\\s)\\]\"'<>`]*",
    # Links to other people's repositories. Upstream's own repository and the shared crates that
    # getnodalia/foundation vendors (craft-libs, egui, winit, craft-fonts) are renamed below.
    "https?://(github\\.com|raw\\.githubusercontent\\.com)/(?!storytold/(designcraft|craft-libs|egui|winit|craft-fonts)\\b|getnodalia|danielmigueltejedor)[^\\s)\\]\"'<>`]*",
    # Upstream's issues named without a link (`storytold/designcraft#123`).
    "storytold/[\\w.-]+#\\d+",
    # The shared test corpus keeps its name.
    "photocraft-corpus",
    # Upstream's repository in the sync workflow and in the record of what came from it.
    "(?<=UPSTREAM_REPO: )storytold/designcraft",
    # The native file's signature, `"format": "designcraft"`, and the media type stored first in
    # every archive: files saved before the rename are read by them, and files Pliego saves stay
    # readable by older versions. The extension is renamed (files under the old one keep opening,
    # `pliego_format::OLDER_EXTENSIONS`).
    '(?:(?<=format\\":\\")|(?<=format\\": \\")|(?<=format":")|(?<=format": "))designcraft(?=\\?")',
    "vnd\\.designcraft\\+zip",
    # Credit for work done upstream.
    "DesignCraft contributors",
    "ArtCraft Team",
    # Crafting hostile input in tests is not a product name.
    "Crafting hostile",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Licence notices keep upstream's copyright line, which the licences require.
    "NOTICE",
    "LICENSE-*",
    "licenses/*",
    # The record of what came from upstream, upstream's own README kept for reference, and the
    # record of the move to Nodalia.
    "docs/upstream.md",
    "docs/upstream-readme.md",
    "NODALIA_MIGRATION.md",
]

# Run after renaming: shorter names change how rustfmt wraps lines and sorts imports.
after = [["cargo", "fmt", "--all"]]

# Lines that keep this app's value when upstream's tree is rebranded (the sync passes --pin-from).
[[pin]]
file = "Cargo.toml"
pattern = '^version = "[^"]*"'

# Identity: app id, publisher, installer identities (a product of its own, never DesignCraft's).
[[replace]]
from = "ai.storyteller.designcraft"
to = "dev.danielmiguelt.Pliego"

[[replace]]
from = "DesignCraft maintainers <designcraft@storyteller.ai>"
to = "Nodalia <https://github.com/getnodalia/pliego/issues>"

[[replace]]
