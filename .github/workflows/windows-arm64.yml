# Windows on ARM: package the ARM64 release the way the release-*.yml workflows does (cross-compiled on an x64
# runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner, check the installed
# binaries are ARM64, run the CLI natively, and uninstall. (A native ARM64 `cargo test` job is left
# out for now: Papel saw an intermittent access violation in egui UI tests there.)
name: Windows ARM64

# Nightly on main and on pushes to `release` (dependency and runner-image drift shows up within a
# day, and always before a release ships), and on PRs that change the Windows packaging itself.
on:
  schedule:
    - cron: "3 5 * * *"
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    uses: getnodalia/foundation/.github/workflows/windows-arm64.yml@c37ef19e6bc213e3ebf3a281f1bf0f3fd7c5d495 # foundation main
    with:
      app-name: pliego
      cli-name: pliego-cli
      fonts-repository: getnodalia/foundation
      fonts-ref: d4f57e6b31d7c7526b539f7aaaa07312c9908bb8 # nodalia/fonts
