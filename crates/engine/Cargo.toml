[package]
name = "pliego-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pliego engine: session, documents, history, selection, command registry, tool hosting"

[lints]
workspace = true

[dependencies]
craft-print = { workspace = true }
craft-docpath = { workspace = true }
pliego-images = { workspace = true }
pliego-geom = { workspace = true }
pliego-color = { workspace = true }
pliego-doc = { workspace = true }
pliego-fonts = { workspace = true }
pliego-compose = { workspace = true }
pliego-render = { workspace = true }
pliego-format = { workspace = true }
pliego-epub = { workspace = true }
pliego-pptx = { workspace = true }
pliego-textimport = { workspace = true }
pliego-pdf = { workspace = true }
craft-prepress = { workspace = true }
pliego-tools = { workspace = true }
pliego-idml = { workspace = true }
indd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
quick-xml = { workspace = true }
caseless = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
pliego-fonts = { workspace = true, features = ["testing"] }
zip = { workspace = true }
hayro-syntax = "0.7.2"
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
