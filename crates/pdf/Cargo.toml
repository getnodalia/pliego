[package]
name = "pliego-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pliego PDF export (krilla): real text with embedded font subsets, CMYK/spot colour, bleed and printer's marks"

[lints]
workspace = true

[dependencies]
pliego-geom = { workspace = true }
pliego-color = { workspace = true }
pliego-doc = { workspace = true }
pliego-fonts = { workspace = true }
pliego-compose = { workspace = true }
nodalia-pdf = { workspace = true, features = ["write-pdf"] }
nodalia-prepress = { workspace = true }
nodalia-cms = { workspace = true }
krilla-svg = { workspace = true }
pliego-images = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# The placed-PDF version check names hayro's PdfVersion (krilla::pdf::Pdf::version returns it).
hayro-syntax = "0.7.2"

[dev-dependencies]
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-fonts"] }
hayro-cmap = "0.1"
kurbo = { workspace = true }
tiff = { workspace = true }
flate2 = "1"
pliego-fonts = { workspace = true, features = ["testing"] }
