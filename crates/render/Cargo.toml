[package]
name = "pliego-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pliego renderer: spreads, pages, frames, composed text and images to pixels (vello_cpu)"

[lints]
workspace = true

[dependencies]
pliego-geom = { workspace = true }
pliego-color = { workspace = true }
pliego-doc = { workspace = true }
pliego-fonts = { workspace = true }
pliego-compose = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
nodalia-pdf = { workspace = true, features = ["raster"] }
pliego-images = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
